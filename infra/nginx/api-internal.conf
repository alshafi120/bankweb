# Internal API front (private network only). Web and admin servers call it; it is not published.
server {
    listen 80 default_server;
    server_name nginx-internal;
    server_tokens off;
    client_max_body_size 7m;

    # Trust the edge/Next.js servers on the private network for X-Forwarded-For.
    set_real_ip_from 172.16.0.0/12;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    location ~ /\. { deny all; }
    location / { include /etc/nginx/snippets/fastcgi-laravel.conf; }
}
