# Withaq Bank — full stack (staging / single-host production).
# Run from the repository root:
#   cp infra/docker/.env.example infra/docker/.env   # fill every secret
#   docker compose -f infra/docker/docker-compose.yml --env-file infra/docker/.env up -d --build
#   docker compose -f infra/docker/docker-compose.yml exec api php artisan migrate --force --seed
# Only nginx publishes ports. MySQL, Redis and MinIO stay on the private network.

name: withaq

x-api-env: &api-env
  APP_ENV: production
  APP_DEBUG: "false"
  APP_KEY: ${APP_KEY:?set APP_KEY (php artisan key:generate --show)}
  APP_URL: https://${API_HOST}
  FRONTEND_URL: https://${WEB_HOST}
  ADMIN_URL: https://${ADMIN_HOST}
  SANCTUM_STATEFUL_DOMAINS: ${ADMIN_HOST}
  SIGNED_URL_BASE: https://${ADMIN_HOST}/backend
  TRUSTED_PROXIES: 172.16.0.0/12
  DB_CONNECTION: mysql
  DB_HOST: mysql
  DB_DATABASE: withaq_cms
  DB_USERNAME: withaq_cms
  DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
  REDIS_HOST: redis
  REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
  CACHE_STORE: redis
  QUEUE_CONNECTION: redis
  SESSION_DRIVER: database
  SESSION_SECURE_COOKIE: "true"
  MEDIA_DISK: s3
  AWS_ACCESS_KEY_ID: ${S3_KEY:?set S3_KEY}
  AWS_SECRET_ACCESS_KEY: ${S3_SECRET:?set S3_SECRET}
  AWS_DEFAULT_REGION: us-east-1
  AWS_BUCKET: withaq-media
  AWS_ENDPOINT: http://minio:9000
  AWS_URL: https://${MEDIA_HOST}/withaq-media
  AWS_USE_PATH_STYLE_ENDPOINT: "true"
  FRONTEND_REVALIDATE_URL: http://web:3000/api/revalidate
  REVALIDATE_SECRET: ${REVALIDATE_SECRET:?set REVALIDATE_SECRET}
  TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
  TURNSTILE_SECRET: ${TURNSTILE_SECRET:-}
  ADMIN_REQUIRE_2FA: "true"
  ADMIN_EMAIL: ${ADMIN_EMAIL:-}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
  MAIL_MAILER: smtp
  MAIL_HOST: ${MAIL_HOST:-}
  MAIL_USERNAME: ${MAIL_USERNAME:-}
  MAIL_PASSWORD: ${MAIL_PASSWORD:-}

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: withaq_cms
      MYSQL_USER: withaq_cms
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes: [mysql:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 10s
      retries: 10
    networks: [backend]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes: [redis:/data]
    networks: [backend]

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_KEY:?set S3_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET:?set S3_SECRET}
    volumes: [minio:/data]
    networks: [backend]

  api:
    build: { context: ../.., dockerfile: infra/docker/api.Dockerfile }
    image: withaq/api
    restart: unless-stopped
    environment: *api-env
    volumes: [api-storage:/var/www/api/storage]
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_started }
    networks: [backend]

  queue:
    image: withaq/api
    restart: unless-stopped
    environment: *api-env
    command: ["php", "artisan", "queue:work", "redis", "--sleep=1", "--tries=3", "--max-time=3600"]
    volumes: [api-storage:/var/www/api/storage]
    depends_on: [api]
    networks: [backend]

  scheduler:
    image: withaq/api
    restart: unless-stopped
    environment: *api-env
    command: ["php", "artisan", "schedule:work"]
    volumes: [api-storage:/var/www/api/storage]
    depends_on: [api]
    networks: [backend]

  web:
    build:
      context: ../..
      dockerfile: infra/docker/next.Dockerfile
      args: { APP: web }
    image: withaq/web
    restart: unless-stopped
    environment:
      API_BASE_URL: http://nginx-internal/api/v1
      SITE_URL: https://${WEB_HOST}
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:?set REVALIDATE_SECRET}
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
    networks: [frontend, backend]

  admin:
    build:
      context: ../..
      dockerfile: infra/docker/next.Dockerfile
      args: { APP: admin, API_ORIGIN: "http://nginx-internal", NEXT_PUBLIC_DEMO_MODE: "false" }
    image: withaq/admin
    restart: unless-stopped
    environment:
      API_ORIGIN: http://nginx-internal
    networks: [frontend, backend]

  # Internal nginx: FastCGI front for the API, reachable only from web/admin on the backend network.
  nginx-internal:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ../nginx/api-internal.conf:/etc/nginx/conf.d/default.conf:ro
      - ../nginx/snippets:/etc/nginx/snippets:ro
    depends_on: [api]
    networks: [backend]

  # Public edge (behind Cloudflare). TLS certificates mounted from the host.
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      WEB_HOST: ${WEB_HOST}
      ADMIN_HOST: ${ADMIN_HOST}
      API_HOST: ${API_HOST}
      MEDIA_HOST: ${MEDIA_HOST}
      ADMIN_ALLOW_CIDR: ${ADMIN_ALLOW_CIDR:-10.0.0.0/8}
    volumes:
      - ../nginx/templates:/etc/nginx/templates:ro
      - ../nginx/snippets:/etc/nginx/snippets:ro
      - ${TLS_DIR:-./tls}:/etc/nginx/tls:ro
    depends_on: [web, admin, nginx-internal]
    networks: [frontend, backend]

volumes:
  mysql: {}
  redis: {}
  minio: {}
  api-storage: {}

networks:
  frontend: {}
  backend: { internal: false }
