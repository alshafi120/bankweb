<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: a single scroll — status strip, segmented switch, masonry-ish grid of framed screenshots. */
:root {
  --bg:#F6F7F4; --surface:#FFFFFF; --ink:#14201F; --muted:#5A6B68; --line:#DCE3E0;
  --brand:#0C3A36; --brand-700:#165E57; --accent:#C8892A; --ok:#1F8A5B; --chip:#E3EFEC;
  --sans:'IBM Plex Sans Arabic',system-ui,sans-serif; --mono:'IBM Plex Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#0D1413; --surface:#141D1C; --ink:#E6ECEA; --muted:#9AABA7; --line:#26332F; --brand-700:#3FA597; --accent:#E0A54A; --ok:#4CC38A; --chip:#16302D; color-scheme:dark; } }
:root[data-theme="dark"] { --bg:#0D1413; --surface:#141D1C; --ink:#E6ECEA; --muted:#9AABA7; --line:#26332F; --brand-700:#3FA597; --accent:#E0A54A; --ok:#4CC38A; --chip:#16302D; color-scheme:dark; }
* { box-sizing:border-box }
body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.7 var(--sans); }
.wrap { max-width:1200px; margin:0 auto; padding-inline:16px; padding-block:24px 48px; }
header.top { background:var(--brand); color:#fff; border-radius:20px; padding:24px; position:relative; overflow:hidden; }
header.top::after { content:""; position:absolute; inset-inline-end:-60px; bottom:-80px; width:220px; height:260px; border:1px solid rgb(255 255 255/.18); border-radius:999px 999px 16px 16px; }
header.top h1 { margin:0 0 4px; font-size:clamp(24px,5vw,34px); text-wrap:balance; }
header.top p { margin:0; color:rgb(255 255 255/.78); max-width:60ch; }
.status { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin-top:20px; position:relative; z-index:1; }
.status div { background:rgb(255 255 255/.08); border:1px solid rgb(255 255 255/.14); border-radius:12px; padding:10px 12px; }
.status b { display:block; font:600 18px/1.3 var(--mono); color:#E9C77A; font-variant-numeric:tabular-nums; }
.status span { font-size:13px; color:rgb(255 255 255/.75); }
.switch { display:inline-flex; gap:4px; padding:4px; background:var(--surface); border:1px solid var(--line); border-radius:999px; margin-block:24px 16px; }
.switch button { font:600 15px var(--sans); border:0; background:none; color:var(--muted); padding:8px 18px; border-radius:999px; cursor:pointer; min-height:40px; }
.switch button[aria-selected="true"] { background:var(--brand); color:#fff; }
.grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:16px; align-items:start; }
.shot { margin:0; background:var(--surface); border:1px solid var(--line); border-radius:14px; overflow:hidden; min-width:0; }
.shot.desk { grid-column:span 2; }
@media (max-width:620px) { .shot.desk { grid-column:auto; } }
.zoom { display:block; width:100%; padding:0; border:0; background:var(--chip); cursor:zoom-in; max-height:520px; overflow:hidden; }
.zoom img { display:block; width:100%; height:auto; }
figcaption { display:flex; flex-direction:column; padding:10px 14px; border-top:1px solid var(--line); }
figcaption span { font-weight:600; }
figcaption small { color:var(--muted); font-size:13px; }
:focus-visible { outline:2px solid var(--accent); outline-offset:3px; }
dialog { border:0; padding:0; background:transparent; max-width:min(1100px,94vw); max-height:92vh; }
dialog::backdrop { background:rgb(8 20 19/.8); }
dialog img { display:block; max-width:100%; max-height:88vh; width:auto; height:auto; border-radius:12px; }
dialog button { position:fixed; top:calc(12px + env(safe-area-inset-top,0px)); inset-inline-end:12px; font:600 15px var(--sans); background:#fff; color:#0C3A36; border:0; border-radius:999px; padding:8px 16px; cursor:pointer; }
.note { color:var(--muted); font-size:14px; margin-top:20px; }
</style>

<dialog id="dlg"><button type="button" id="close">إغلاق</button><img id="big" alt=""></dialog>
<script>
const tabs=[...document.querySelectorAll('[role=tab]')];
tabs.forEach(t=>t.addEventListener('click',()=>{tabs.forEach(x=>{const on=x===t;x.setAttribute('aria-selected',on);document.getElementById(x.getAttribute('aria-controls')).hidden=!on;});}));
const dlg=document.getElementById('dlg'),big=document.getElementById('big');
document.querySelectorAll('.zoom').forEach(b=>b.addEventListener('click',()=>{const i=b.querySelector('img');big.src=i.src;big.alt=i.alt;dlg.showModal();}));
document.getElementById('close').addEventListener('click',()=>dlg.close());
dlg.addEventListener('click',e=>{if(e.target===dlg)dlg.close();});
</script>
